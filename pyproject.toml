[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "biopotgas"
version = "0.6.1"
description = "BioPot-Gas: theoretical biogas and biomethane potential estimation from organic substrates."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["biopotgas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]